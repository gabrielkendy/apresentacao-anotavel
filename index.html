<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Funis de Venda — Apresentação Premium + Anotação</title>
<style>
  :root{
    --bg:#eef0f3; --card:#ffffff; --line:#e4e7ec; --ink:#16181d; --muted:#6b7280;
    --green:#10b981; --green-d:#059669; --blue:#2563eb; --amber:#f59e0b; --red:#ef4444; --violet:#7c3aed;
    --shadow:0 1px 2px rgba(22,24,29,.04), 0 10px 30px rgba(22,24,29,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);}

  .toolbar{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:4px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);}
  .tbtn{width:40px;height:40px;border-radius:11px;border:none;background:transparent;font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink);transition:.12s;}
  .tbtn:hover{background:#f0f1f4;}
  .tbtn.on{background:var(--ink);color:#fff;}
  .tsep{height:1px;background:var(--line);margin:4px 0;}
  .topbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:8px;align-items:center;}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--muted);
    display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);}
  .pill b{color:var(--ink);}
  .mode-toggle{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;display:flex;box-shadow:var(--shadow);}
  .mode-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted);}
  .mode-toggle button.on{background:var(--ink);color:#fff;font-weight:700;}
  .bottombar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;gap:8px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);}
  .nbtn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;font-size:16px;cursor:pointer;color:var(--ink);}
  .nbtn:hover{background:#f0f1f4;}
  .counter{font-size:13px;color:var(--muted);min-width:70px;text-align:center;}
  .savebtn{background:var(--green);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .savebtn:hover{filter:brightness(1.08);}

  .brushctl{position:fixed;left:14px;bottom:90px;z-index:90;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px;box-shadow:var(--shadow);width:230px;}
  .brushctl h4{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:10px;}
  .brushctl .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brushctl label{font-size:12px;color:var(--muted);min-width:52px;}
  .brushctl input[type=range]{flex:1;accent-color:var(--green);}
  .brushctl .szval{font-size:13px;font-weight:700;min-width:22px;text-align:right;}
  .brushctl .swrow{display:flex;flex-wrap:wrap;gap:8px;}
  .sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .sw.on{border-color:var(--ink);transform:scale(1.12);}
  .preview{width:100%;height:8px;border-radius:99px;background:#eef0f3;position:relative;overflow:hidden;}
  .preview i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);border-radius:50%;}

  #ink{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:80;pointer-events:none;cursor:crosshair;touch-action:none;}
  #ink.on{pointer-events:auto;}

  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .slide{position:absolute;display:none;}
  .slide.active{display:flex;align-items:center;justify-content:center;animation:in .45s cubic-bezier(.16,1,.3,1);}
  @keyframes in{from{opacity:0;transform:translateX(30px) scale(.985)}to{opacity:1;transform:none}}
  .frame{width:min(1120px,94vw);aspect-ratio:16/9;max-height:86vh;background:var(--card);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,3.4vw,44px) clamp(28px,4.5vw,58px);
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .frame::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(700px 300px at 85% -10%, rgba(16,185,129,.06), transparent 60%);}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-d);margin-bottom:16px;}
  h1{font-size:clamp(30px,4.6vw,60px);line-height:1.0;letter-spacing:-.03em;font-weight:800;}
  h1 .g{color:var(--green);} h1 .b{color:var(--blue);} h1 .a{color:var(--amber);} h1 .r{color:var(--red);}
  .sub{color:var(--muted);font-size:clamp(14px,1.5vw,18px);margin-top:16px;max-width:58ch;line-height:1.55;}
  .grid{display:grid;gap:14px;margin-top:26px;}
  .g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g5{grid-template-columns:repeat(5,1fr);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(22,24,29,.04),0 6px 16px rgba(22,24,29,.05);}
  .card b{display:block;font-size:16px;margin-bottom:4px;}
  .card p{color:var(--muted);font-size:13px;line-height:1.5;}
  .big{font-size:clamp(26px,3.6vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1;}
  .big.g{color:var(--green);} .big.b{color:var(--blue);} .big.a{color:var(--amber);}
  .emo{font-size:30px;line-height:1;margin-bottom:8px;}

  .formula{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:34px;}
  .fcell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 24px;box-shadow:var(--shadow);text-align:center;}
  .fcell .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
  .fop{font-size:30px;font-weight:700;color:#c3c8d2;}
  .fnote{margin-top:30px;text-align:center;font-weight:700;color:var(--green-d);font-size:17px;}

  .split{display:grid;grid-template-columns:1fr 1.05fr;gap:34px;align-items:center;}
  .funnelfig{display:flex;justify-content:center;}
  .funnelfig svg{width:min(300px,100%);height:auto;filter:drop-shadow(0 14px 26px rgba(22,24,29,.16));}
  .chanrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chanchip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(22,24,29,.04);}
  .msg-balloon{background:#e9f9f0;border:1px solid rgba(16,185,129,.28);border-radius:18px 18px 18px 4px;padding:16px 20px;margin-top:20px;max-width:470px;box-shadow:var(--shadow);}
  .msg-balloon .head{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--green-d);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
  .msg-balloon .head .live{background:var(--green);color:#fff;border-radius:999px;padding:1px 9px;font-size:10px;letter-spacing:.04em;}
  .msg-balloon p{font-size:14.5px;line-height:1.55;color:var(--ink);}
  .msg-balloon .time{font-size:10.5px;color:var(--muted);margin-top:6px;text-align:right;}

  .cover{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;height:100%;}
  .cover .stats{display:flex;flex-direction:column;gap:12px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;}
  .stat .badge{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0;}
  .stat b{font-size:16px;display:block;}
  .stat p{font-size:12px;color:var(--muted);}
  .coverbadge{display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,.1);color:var(--green-d);
    border:1px solid rgba(16,185,129,.3);border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;}

  .annotip{position:fixed;right:16px;bottom:16px;z-index:95;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 16px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;}
  .annotip b{color:var(--ink);}
  .dot-on{width:8px;height:8px;border-radius:50%;background:var(--green);}
  .dot-off{width:8px;height:8px;border-radius:50%;background:#c3c8d2;}
  body.ui-hidden .toolbar,body.ui-hidden .topbar,body.ui-hidden .bottombar,body.ui-hidden .brushctl,body.ui-hidden .annotip{display:none;}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);z-index:99;background:var(--ink);color:#fff;
    padding:10px 24px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="toolbar">
  <button class="tbtn on" id="tPen" title="Lápis (P)">✏️</button>
  <button class="tbtn" id="tMarker" title="Caneta (M)">🖊️</button>
  <button class="tbtn" id="tHigh" title="Marca-texto (H)">🖍️</button>
  <button class="tbtn" id="tErase" title="Borracha (E)">🧽</button>
  <div class="tsep"></div>
  <button class="tbtn" id="tUndo" title="Desfazer (Ctrl+Z)">↩</button>
  <button class="tbtn" id="tClear" title="Limpar anotações">🗑</button>
</div>

<div class="brushctl" id="brushctl">
  <h4>Pincel</h4>
  <div class="row"><label>Tamanho</label><input type="range" id="brushSize" min="1" max="42" value="4"><span class="szval" id="szval">4</span></div>
  <div class="swrow" id="swatches"></div>
  <div style="height:10px"></div>
  <div class="preview"><i id="brushPreview"></i></div>
</div>

<div class="topbar">
  <div class="pill">📋 <b id="pageName">Slide 1</b></div>
  <div class="mode-toggle">
    <button id="modeSlides" class="on">Slides</button>
    <button id="modeFree">Livre</button>
  </div>
</div>

<div class="stage" id="stage"></div>
<canvas id="ink"></canvas>

<div class="bottombar">
  <button class="nbtn" id="prev">‹</button>
  <div class="counter"><span id="counter">1</span> / <span id="total">14</span></div>
  <button class="nbtn" id="next">›</button>
  <span style="color:var(--line)">|</span>
  <button class="savebtn" id="saveBtn">💾 Salvar PNG</button>
</div>

<div class="annotip" id="annotip"><span class="dot-off" id="annDot"></span><span id="annText">Anotação OFF · aperta <b>N</b> ou duplo clique pra ligar</span></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
(function(){
  'use strict';
  const stage=document.getElementById('stage');
  const slides=[];
  function addSlide(html){
    const d=document.createElement('div');d.className='slide';
    const f=document.createElement('div');f.className='frame';f.innerHTML=html;
    d.appendChild(f);stage.appendChild(d);slides.push(d);
  }

  addSlide(`
    <div class="cover">
      <div>
        <span class="coverbadge">🎯 Zápia · Estratégia de Vendas</span>
        <h1>5 FUNIS DE VENDA<br><span class="g">pra Vender Mais</span><br>Todo Mês</h1>
        <p class="sub">Cada público da sua base recebe o funil certo, no momento certo, em 3 canais ao mesmo tempo.</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="badge" style="background:var(--blue)">5</span><div><b>Funis</b><p>um pra cada público</p></div></div>
        <div class="stat"><span class="badge" style="background:var(--green)">3</span><div><b>Canais</b><p>WhatsApp + e-mail + redes</p></div></div>
        <div class="stat"><span class="badge" style="background:var(--amber)">3x</span><div><b>Mais vendas</b><p>mesma taxa de conversão</p></div></div>
      </div>
    </div>`);

  addSlide(`
    <span class="kicker">A base de tudo</span>
    <h1>A fórmula do <span class="b">faturamento</span></h1>
    <div class="formula">
      <div class="fcell"><span class="big g">Clientes</span><div class="lbl">nº de clientes</div></div>
      <span class="fop">×</span>
      <div class="fcell"><span class="big">Ticket médio</span><div class="lbl">quanto cada um gasta</div></div>
      <span class="fop">×</span>
      <div class="fcell"><span class="big">Frequência</span><div class="lbl">quantas vezes compra</div></div>
    </div>
    <div class="fnote">▲ Essa estratégia mexe na primeira: mais clientes, mais oportunidades.</div>`);

  addSlide(`
    <span class="kicker">O diagnóstico</span>
    <h1>O erro de tratar <span class="r">todo mundo igual</span></h1>
    <div class="grid g3">
      <div class="card"><div class="emo">📢</div><b>Mensagem única</b><p>a mesma oferta pra base inteira</p></div>
      <div class="card"><div class="emo">⏰</div><b>Momento errado</b><p>oferta cedo ou tarde vira spam</p></div>
      <div class="card"><div class="emo">😞</div><b>Venda perdida</b><p>ninguém compra sem momento</p></div>
    </div>
    <p class="sub" style="margin-top:26px">A mensagem certa no momento certo é oportunidade. Fora disso, é spam.</p>`);

  const funis=[['🆕','1','Alunos novos','7 dias grátis'],['💬','2','Clientes ativos','comunicados'],['⏳','3','Renovação','bonificação'],['🔁','4','Ex-alunos','oferta de volta'],['🎂','5','Aniversariantes','brinde']];
  addSlide(`
    <span class="kicker">A estratégia</span>
    <h1>5 funis, <span class="a">um pra cada público</span></h1>
    <div class="grid g5">
      ${funis.map(f=>`<div class="card" style="text-align:center;padding:16px 10px"><div class="emo">${f[0]}</div><span class="big b">${f[1]}</span><div style="height:5px"></div><b style="font-size:14px">${f[2]}</b><p style="font-size:12px">${f[3]}</p></div>`).join('')}
    </div>`);

  addSlide(`
    <span class="kicker">A execução</span>
    <h1>3 canais ao mesmo <span class="b">tempo</span></h1>
    <div class="grid g3">
      <div class="card" style="text-align:center;padding:26px 16px"><div class="emo" style="font-size:44px">📱</div><b style="font-size:17px">WhatsApp</b><p>API oficial, selo de empresa, resposta na mesma conversa</p></div>
      <div class="card" style="text-align:center;padding:26px 16px"><div class="emo" style="font-size:44px">✉️</div><b style="font-size:17px">E-mail</b><p>oferta detalhada + link, na caixa de entrada</p></div>
      <div class="card" style="text-align:center;padding:26px 16px"><div class="emo" style="font-size:44px">📲</div><b style="font-size:17px">Redes sociais</b><p>segmentada: só quem tá na lista vê</p></div>
    </div>
    <p class="sub" style="margin-top:24px;font-weight:700;color:var(--green-d)">Abre o WhatsApp → tá lá. Abre o e-mail → tá lá. Entra na rede → tá lá. 3 toques, mesma semana.</p>`);

  addSlide(`
    <span class="kicker">A prova</span>
    <h1>Mais oportunidades, <span class="a">mesma conversão</span></h1>
    <div class="split" style="grid-template-columns:1fr 1.1fr">
      <div class="grid g2" style="margin-top:20px">
        <div class="card" style="text-align:center;padding:22px"><span class="big b">500</span><p style="font-size:13px;margin:4px 0 10px">pessoas contatadas</p><span class="big">50</span><p style="font-size:11px">vendas (10%)</p></div>
        <div class="card" style="text-align:center;padding:22px;border-color:rgba(16,185,129,.4)"><span class="big g">1.500</span><p style="font-size:13px;margin:4px 0 10px">pessoas contatadas</p><span class="big">150</span><p style="font-size:11px">vendas (10%)</p></div>
      </div>
      <div>
        <svg viewBox="0 0 320 240" width="100%" style="max-width:360px">
          <rect x="30" y="150" width="80" height="60" rx="10" fill="#93c5fd"/>
          <text x="70" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">500</text>
          <rect x="190" y="40" width="80" height="170" rx="10" fill="#34d399"/>
          <text x="230" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#059669">1.500</text>
          <text x="70" y="230" text-anchor="middle" font-size="12" fill="#6b7280">antes</text>
          <text x="230" y="230" text-anchor="middle" font-size="12" fill="#6b7280">com funis</text>
          <path d="M120 120 L185 90" stroke="#16181d" stroke-width="3" stroke-linecap="round"/>
          <text x="152" y="105" text-anchor="middle" font-size="20">🚀</text>
        </svg>
        <p style="text-align:center;font-size:12px;color:var(--muted)">Vendas triplicadas sem melhorar a taxa</p>
      </div>
    </div>`);

  const zap=[['🗂','CRM','separa os 5 públicos'],['📤','Disparos','API oficial por funil'],['📊','Métricas','abriu, respondeu, comprou'],['🏢','Centralização','celulares num lugar'],['🤖','Agente supervisor','cuida do CRM e da gestão']];
  addSlide(`
    <span class="kicker">A solução</span>
    <h1>A Zápia faz tudo <span class="g">no mesmo lugar</span></h1>
    <div class="grid g5">
      ${zap.map(z=>`<div class="card" style="text-align:center;padding:20px 10px"><div class="emo" style="font-size:36px">${z[0]}</div><b style="font-size:14px">${z[1]}</b><p style="font-size:11px">${z[2]}</p></div>`).join('')}
    </div>`);

  addSlide(`
    <span class="kicker">Bora vender mais</span>
    <h1>Comece por <span class="g">UM funil</span>.<br>Valide. Escale.</h1>
    <div class="split" style="grid-template-columns:auto 1fr;gap:44px;margin-top:26px;align-items:center">
      <div style="text-align:center">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=https%3A%2F%2Fzapia.site" alt="QR Code ZapIA" style="width:180px;height:180px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);background:#fff;padding:10px">
        <p style="font-size:11px;color:var(--muted);margin-top:10px">Aponte a câmera e teste grátis</p>
      </div>
      <div class="grid g2" style="margin-top:0">
        <div class="card"><b>🚀 Zápia</b><p>zapia.site</p></div>
        <div class="card"><b>📱 WhatsApp</b><p>(31) 99755-4040</p></div>
        <div class="card"><b>✉️ E-mail</b><p>contato@zapia.site</p></div>
        <div class="card"><b>📸 Instagram</b><p>@appzap.ia</p></div>
      </div>
    </div>
    <p class="sub" style="margin-top:26px;font-size:13px">📚 Material do aluno: materiais-aulas.vercel.app/zapia-5-funis</p>`);

  addSlide(`<span class="kicker">Prancheta livre</span><h1>Desenhe à vontade ✍️</h1><p class="sub">Use o pincel pra explicar, riscar e montar teu próprio funil.</p>`);
  const FREE_INDEX=slides.length-1;

  // ================= NAVEGAÇÃO =================
  let cur=0, mode='slides';
  const counter=document.getElementById('counter'), total=document.getElementById('total'), pageName=document.getElementById('pageName');
  function go(i){
    if(i<0||i>=slides.length)return;
    slides[cur].classList.remove('active');
    cur=i;
    slides[cur].classList.add('active');
    counter.textContent=cur+1;
    pageName.textContent=(mode==='slides'?'Slide '+(cur+1):'Página '+(cur+1));
    redraw();
  }
  total.textContent=slides.length;
  document.getElementById('prev').onclick=()=>go(cur-1);
  document.getElementById('next').onclick=()=>go(cur+1);
  document.getElementById('modeSlides').onclick=()=>setMode('slides');
  document.getElementById('modeFree').onclick=()=>setMode('free');
  function setMode(m){
    mode=m;
    document.getElementById('modeSlides').classList.toggle('on',m==='slides');
    document.getElementById('modeFree').classList.toggle('on',m==='free');
    go(m==='free'?FREE_INDEX:0);
  }

  // ================= ANOTAÇÃO (CANVAS) =================
  const ink=document.getElementById('ink'), ctx=ink.getContext('2d');
  let annotating=false, tool='pen', color='#16181d', size=4, drawing=false;
  const strokesPerSlide=slides.map(()=>[]);
  const undoStack=[];
  const sizes={pen:4,marker:8,high:26,erase:26};
  const alphas={pen:1,marker:.85,high:.38,erase:1};

  function pushUndo(){undoStack.push(JSON.stringify(strokesPerSlide[cur]));if(undoStack.length>40)undoStack.shift();}
  function undo(){
    if(!undoStack.length){toast('Nada pra desfazer');return;}
    strokesPerSlide[cur]=JSON.parse(undoStack.pop());
    redraw();toast('Desfeito ↩');
  }

  function sizeCanvas(){
    const rect=ink.getBoundingClientRect();
    ink.width=Math.max(1,Math.round(rect.width*devicePixelRatio));
    ink.height=Math.max(1,Math.round(rect.height*devicePixelRatio));
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    redraw();
  }
  // ponto relativo ao canvas (0,0 = canto superior esquerdo do canvas = tela)
  function pt(e){const r=ink.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function redraw(){
    ctx.clearRect(0,0,ink.width,ink.height);
    for(const s of strokesPerSlide[cur]){
      ctx.beginPath();
      ctx.globalCompositeOperation=(s.tool==='erase')?'destination-out':'source-over';
      ctx.globalAlpha=alphas[s.tool];
      ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';
      s.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
      ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  ink.addEventListener('pointerdown',e=>{
    if(!annotating)return;
    drawing=true;
    pushUndo();
    strokesPerSlide[cur].push({tool,color,size,pts:[pt(e)]});
    ink.setPointerCapture(e.pointerId);
  });
  ink.addEventListener('pointermove',e=>{
    if(!drawing)return;
    const s=strokesPerSlide[cur][strokesPerSlide[cur].length-1];
    s.pts.push(pt(e));
    redraw();
  });
  ink.addEventListener('pointerup',()=>drawing=false);
  ink.addEventListener('dblclick',()=>setAnnotating(!annotating));

  function setAnnotating(v){
    annotating=v;
    ink.classList.toggle('on',v);
    document.getElementById('annDot').className=v?'dot-on':'dot-off';
    document.getElementById('annText').textContent=v?'Anotação ON · desenha à vontade':'Anotação OFF · aperta N ou duplo clique pra ligar';
    document.body.style.cursor=v?'crosshair':'';
  }
  function setTool(t){
    tool=t;
    size=sizes[t]||4;
    document.getElementById('brushSize').value=size;
    document.getElementById('szval').textContent=size;
    updatePreview();
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
    document.getElementById({pen:'tPen',marker:'tMarker',high:'tHigh',erase:'tErase'}[t]).classList.add('on');
    setAnnotating(true);
  }
  document.getElementById('tPen').onclick=()=>setTool('pen');
  document.getElementById('tMarker').onclick=()=>setTool('marker');
  document.getElementById('tHigh').onclick=()=>setTool('high');
  document.getElementById('tErase').onclick=()=>setTool('erase');
  document.getElementById('tUndo').onclick=undo;
  document.getElementById('tClear').onclick=()=>{pushUndo();strokesPerSlide[cur]=[];redraw();toast('Anotações limpas 🗑');};

  const colors=['#1a1a1e','#059669','#2563eb','#d97706','#dc2626','#7c3aed','#db2777','#0891b2'];
  const sw=document.getElementById('swatches');
  colors.forEach(c=>{
    const d=document.createElement('div');d.className='sw'+(c===color?' on':'');d.style.background=c;d.dataset.c=c;
    d.onclick=()=>{color=c;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));d.classList.add('on');updatePreview();};
    sw.appendChild(d);
  });
  const slider=document.getElementById('brushSize');
  slider.oninput=()=>{size=+slider.value;document.getElementById('szval').textContent=size;updatePreview();};
  function updatePreview(){
    const p=document.getElementById('brushPreview');
    p.style.width=p.style.height=Math.min(size,40)+'px';
    p.style.background=color;
  }
  updatePreview();

  // ================= SALVAR PNG =================
  document.getElementById('saveBtn').onclick=savePng;
  function savePng(){
    const frame=slides[cur].querySelector('.frame');
    const fr=frame.getBoundingClientRect();
    const W=1120,H=630,scaleX=W/fr.width,scaleY=H/fr.height;
    if(typeof html2canvas==='undefined'){toast('Sem internet pra lib de exportação');return;}
    toast('Gerando PNG…');
    html2canvas(frame,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{
      const off=document.createElement('canvas');
      off.width=W;off.height=H;
      const c=off.getContext('2d');
      c.drawImage(canvas,0,0,W,H);
      // overlay das anotações
      for(const s of strokesPerSlide[cur]){
        c.beginPath();
        c.globalCompositeOperation=(s.tool==='erase')?'destination-out':'source-over';
        c.globalAlpha=alphas[s.tool];
        c.strokeStyle=s.color;c.lineWidth=s.size*scaleX;c.lineCap='round';c.lineJoin='round';
        s.pts.forEach((p,i)=>{
          const px=(p.x-fr.left)*scaleX, py=(p.y-fr.top)*scaleY;
          i?c.lineTo(px,py):c.moveTo(px,py);
        });
        c.stroke();
      }
      c.globalCompositeOperation='source-over';c.globalAlpha=1;
      const a=document.createElement('a');
      a.download=(mode==='slides'?'slide-'+(cur+1):'prancheta')+'.png';
      a.href=off.toDataURL('image/png');
      a.click();
      toast('PNG salvo ✅');
    }).catch(()=>toast('Falha ao salvar, tenta de novo'));
  }

  // ================= TECLADO =================
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){e.preventDefault();go(cur+1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
    else if(e.key==='n'||e.key==='N')setAnnotating(!annotating);
    else if(e.key==='h'||e.key==='H')document.body.classList.toggle('ui-hidden');
    else if(e.key==='p'||e.key==='P')setTool('pen');
    else if(e.key==='m'||e.key==='M')setTool('marker');
    else if(e.key==='l'||e.key==='L')setTool('high');
    else if(e.key==='e'||e.key==='E')setTool('erase');
    else if(e.key==='s'||e.key==='S')savePng();
    else if(e.key==='Escape')setAnnotating(false);
    else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  });

  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

  sizeCanvas();
  window.addEventListener('resize',sizeCanvas);
  go(0);
})();
</script>
</body>
</html>
